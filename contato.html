<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
</head>
<body>
    <header>
        <h1>Bruno Freitas Costa</h1>
        <h2>Desenvolvedor Web em formação</h2>
        <nav>   
            <ul>
                <li><a href="index.html"target="_blank">Sobre mim</a></li>
                <li><a href="currículo.html"target="_blank">Currículo</a></li>
                <li><a href="contato.html"target="_blank">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <Section>
            <h2>Fale Comigo</h2>
            <form action="/contato" method="post">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                 <input type="text" name="nome" id="nome" required>
                    <label for="Nome">Nome</label>
                 <input type="email" name="email" id="email" required>
                    <label for="email">Email</label>
                 <input type="tel" name="Telefone" id="Telefone">
                     <label for="Telefone">Telefone</label> 
                 <input type="date" name="Date" id="Date">
                     <label for="Date">Data de nascimento</label>
                 
                </fieldset>
                <fieldset>
                   <Legend>
                    Endereço
                   </Legend>
                <input type="text" name="Cep" id="Cep" placeholder="Somente números" pattern="[0-9]{8}" title="Coloque seu cep" required minlength="">
                <label for="Cep">Cep</label>
                <input type="text" name="rua" id="rua" minlength="3">
                <label for="rua">Rua</label>
                <input type="number" name="numero" id="num" min="1" max="9999">
                <label for="numero" >Número</label>
                <input type="text" name="Cidade" id="Cidade">
                <label for="Cidade">Cidade</label>
            <select name="Estado" id="Estado">
                <option value="PR">PR</option>
                <option value="RS">RS</option>
                <option value="GO">GO</option>
                <option value="ES">ES</option>
                <option value="SP">SP</option>
                </select>
                </fieldset>
                <FIeldset>
                    <legend>Interesse</legend>
                    <select name="area" id="area">
                        <option value=""></option>
                        <option value="FE">Front-end</option>
                        <option value="BE">Back-end</option>
                        <option value="BD">Banco de Dados</option>
                        <option value="FS">FullStack</option>
                    </select>
                    <legend>Nível de Experiencia</legend>
                    <input type="radio" name="Nível" id="ini" value="Iniciante">
                    <label for="ini">Iniciante</label>
                    <input type="radio" name="Nível" id="int" value="Intermediário">
                    <label for="int">Intermediário</label>
                    <input type="radio" name="Nível" id="avan" value="Avançado">
                    <label for="avan">Avançado</label>
                    <p><textarea name="mensagem" id="mensagem" maxlength="500"></textarea></p>
                    <input type="checkbox" name="check" id="box" required>
                    <label for="box">Li e aceito os termos de uso</label>
                    <button type="submit">Enviar</button>
                </FIeldset>
            </form>
        </Section>
    </main>
    <footer>
       <p> &copy;2026 Bruno bruno-costa </p>
       <a href="mailto:bfc.022601@gmail.com">Email para contato</a>
    </footer>
</body>
</html>
